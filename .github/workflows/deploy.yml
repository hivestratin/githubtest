# Lab 1 + Homework 6: test -> deploy to EC2, with a manual Run workflow button
# Secrets needed (Settings -> Secrets and variables -> Actions):
#   EC2_HOST     public IP or DNS of the instance
#   EC2_USER     e.g. ubuntu
#   EC2_SSH_KEY  full contents of the .pem private key
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:       # Homework 6: manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          pip install -r requirements.txt
          pytest -v

  deploy:
    needs: test            # runs only if test passed
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo apt-get update -y
            sudo apt-get install -y python3-venv git
            if [ ! -d ~/app ]; then
              git clone https://github.com/${{ github.repository }}.git ~/app
            fi
            cd ~/app
            git fetch origin main
            git reset --hard origin/main
            python3 -m venv venv
            ./venv/bin/pip install -r requirements.txt
            pkill -f "app/app.py" || true
            nohup ./venv/bin/python app/app.py > app.log 2>&1 &
            sleep 2
            curl -fsS http://localhost:5000/health
